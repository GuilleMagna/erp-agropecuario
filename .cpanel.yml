---
deployment:
  tasks:
    - export APPPATH=/home/hilariomagnano/repositories/erp-agropecuario
    - export DEPLOYPATH=/home/hilariomagnano/public_html
    - if [ -f "$APPPATH/server.env" ]; then /bin/mv "$APPPATH/server.env" "$APPPATH/.env"; fi
    - if [ -f "$APPPATH/vendor.zip" ]; then /usr/bin/unzip -oq "$APPPATH/vendor.zip" -d "$APPPATH" && /bin/rm "$APPPATH/vendor.zip"; fi
    - /bin/mkdir -p $DEPLOYPATH/build
    - /bin/mkdir -p $DEPLOYPATH/images
    - /bin/cp $APPPATH/public/.htaccess $DEPLOYPATH/.htaccess
    - /bin/cp $APPPATH/public/favicon.ico $DEPLOYPATH/favicon.ico
    - /bin/cp $APPPATH/public/robots.txt $DEPLOYPATH/robots.txt
    - /bin/cp $APPPATH/deploy/cpanel/index.php $DEPLOYPATH/index.php
    - /bin/cp -R $APPPATH/public/build/. $DEPLOYPATH/build
    - /bin/cp -R $APPPATH/public/images/. $DEPLOYPATH/images
    - /bin/ln -sfn $APPPATH/storage/app/public $DEPLOYPATH/storage
    - /bin/chmod -R ug+rwX $APPPATH/storage $APPPATH/bootstrap/cache
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_11_190000_backfill_retenciones_iva_ventas.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_11_200000_add_july_period_and_vat_refunds.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_180000_add_presentado_arca_to_compras_table.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_181000_fix_compras_elvio_enero_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_190000_conciliar_compras_elvio_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_200000_cargar_compras_faltantes_elvio_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_210000_add_datos_fiscales_to_ventas_granos_table.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_211000_conciliar_ventas_elvio_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_220000_conciliar_compras_wilmar_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_221000_conciliar_ventas_wilmar_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_230000_conciliar_compras_sociedad_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_231000_conciliar_ventas_granos_sociedad_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_240000_add_datos_fiscales_to_ventas_hacienda_table.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_241000_conciliar_ventas_hacienda_sociedad_enero_junio_2026.php
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force --path=database/migrations/2026_08_12_242000_borrar_ventas_duplicadas.php
    - cd $APPPATH && /usr/local/bin/php artisan view:clear
